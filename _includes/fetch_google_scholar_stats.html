<script>
// Update citation / star badges and hide them when the count is 0.
// Uses native fetch() so it works without jQuery on the page.
(function () {
  function hideCountBadge(el) {
    if (!el) return;
    var link = el.closest('a');
    if (!link) {
      el.style.display = 'none';
      return;
    }
    var text = (link.textContent || '').replace(/\s+/g, ' ').trim();
    if (link.classList.contains('paper-badge') || !text) {
      link.style.display = 'none';
    } else {
      el.style.display = 'none';
    }
  }

  function citationCountFromSrc(src) {
    var match = (src || '').match(/Citations-(\d+)/i);
    return match ? parseInt(match[1], 10) : null;
  }

  function applyCitationCount(el, num) {
    var count = parseInt(num, 10);
    if (!count) {
      hideCountBadge(el);
      return;
    }
    el.src = 'https://img.shields.io/badge/Citations-' + count + '-blue?style=social&logo=google-scholar';
  }

  document.querySelectorAll('.paper_citations').forEach(function (el) {
    if (citationCountFromSrc(el.getAttribute('src')) === 0) {
      hideCountBadge(el);
    }
  });

  var gsDataUrl = '{{ site.baseurl }}/google-scholar-stats/gs_data.json';

  fetch(gsDataUrl)
    .then(function (resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function (data) {
      console.log("Successfully loaded Google Scholar data:", data);
      if (!data) return;

      if (data.citedby !== undefined) {
        document.querySelectorAll('.total_citations').forEach(function (el) {
          if (!parseInt(data.citedby, 10)) {
            hideCountBadge(el);
            return;
          }
          el.src = 'https://img.shields.io/badge/Total%20Citations-' + data.citedby + '-blue?style=social&logo=google-scholar';
        });
      }

      if (data.publications) {
        document.querySelectorAll('.paper_citations').forEach(function (el) {
          var paperId = el.getAttribute('data-paper-id');
          if (paperId && data.publications[paperId]) {
            applyCitationCount(el, data.publications[paperId].num_citations);
          }
        });
      }

      renderScholarWidget(data);
    })
    .catch(function (err) {
      console.log("Failed to load Google Scholar stats from " + gsDataUrl);
      console.log("Error details:", err);
    });

  function repoFromStarImg(img) {
    var src = img.getAttribute('src') || '';
    var match = src.match(/github\/stars\/([^/?#]+\/[^/?#]+)/);
    if (match) return match[1];
    var href = img.closest('a') && img.closest('a').getAttribute('href');
    match = (href || '').match(/github\.com\/([^/?#]+\/[^/?#]+)/);
    return match ? match[1] : null;
  }

  document.querySelectorAll('img[src*="img.shields.io/github/stars/"]').forEach(function (el) {
    var repo = repoFromStarImg(el);
    if (!repo) return;
    fetch('https://api.github.com/repos/' + repo)
      .then(function (resp) {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      })
      .then(function (repoData) {
        if (!parseInt(repoData.stargazers_count, 10)) {
          hideCountBadge(el);
        }
      })
      .catch(function (err) {
        console.log("Failed to load GitHub stars for " + repo, err);
      });
  });

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function numOr(value, fallback) {
    var n = parseInt(value, 10);
    return isNaN(n) ? fallback : n;
  }

  function renderScholarWidget(data) {
    var el = document.getElementById('scholar-citation-chart');
    if (!el || !data) return;
    var citesPerYear = data.cites_per_year || {};
    var years = Object.keys(citesPerYear).sort();
    var citedby = numOr(data.citedby, 0);
    var zh = el.getAttribute('data-lang') === 'zh';
    var sinceYear = numOr(data.since_year, new Date().getFullYear() - 5);
    var html = '';
    html += '<a class="scholar-widget-title" href="https://scholar.google.com/citations?user=edyJPQQAAAAJ">';
    html += zh ? '被引用次数' : 'Cited by';
    html += '</a>';
    html += '<table class="scholar-table"><thead><tr><th></th><th>';
    html += zh ? '总计' : 'All';
    html += '</th><th>';
    html += zh ? (sinceYear + ' 年至今') : ('Since ' + sinceYear);
    html += '</th></tr></thead><tbody>';
    [
      [zh ? '引用' : 'Citations', citedby, numOr(data.citedby_5y, citedby)],
      [zh ? 'h 指数' : 'h-index', numOr(data.hindex, 0), numOr(data.hindex_5y, numOr(data.hindex, 0))],
      [zh ? 'i10 指数' : 'i10-index', numOr(data.i10index, 0), numOr(data.i10index_5y, numOr(data.i10index, 0))]
    ].forEach(function (row) {
      html += '<tr><td>' + row[0] + '</td><td>' + row[1] + '</td><td>' + row[2] + '</td></tr>';
    });
    html += '</tbody></table>';

    if (years.length) {
      var counts = years.map(function (year) { return numOr(citesPerYear[year], 0); });
      var max = Math.max.apply(null, counts.concat([1]));
      var mid = Math.round(max / 2);
      html += '<div class="scholar-hist">';
      html += '<div class="scholar-y" style="top:8px">' + max + '</div>';
      html += '<div class="scholar-y" style="top:91px">' + mid + '</div>';
      html += '<div class="scholar-y" style="top:174px">0</div>';
      html += '<div class="scholar-hist-plot">';
      html += '<div class="scholar-grid-line" style="top:0"></div>';
      html += '<div class="scholar-grid-line" style="top:50%"></div>';
      html += '<div class="scholar-grid-line" style="top:100%"></div>';
      html += '<div class="scholar-bars">';
      years.forEach(function (year, i) {
        var height = Math.max(2, Math.round((counts[i] / max) * 100));
        html += '<div class="scholar-bar-wrap" title="' + counts[i] + '">';
        html += '<div class="scholar-bar" style="height:' + height + '%"></div>';
        html += '<div class="scholar-bar-year">' + escapeHtml(year) + '</div>';
        html += '</div>';
      });
      html += '</div></div></div>';
    }
    el.innerHTML = html;
  }

  function isoDate(date) {
    return date.getFullYear() + '-' +
      String(date.getMonth() + 1).padStart(2, '0') + '-' +
      String(date.getDate()).padStart(2, '0');
  }

  function renderGithubHeatmap(days) {
    var el = document.getElementById('github-activity-chart');
    if (!el) return;
    var byDate = {};
    (days || []).forEach(function (day) {
      if (day && day.date) byDate[day.date] = day;
    });
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var start = new Date(today);
    start.setDate(start.getDate() - 52 * 7);
    start.setDate(start.getDate() - start.getDay());

    var cell = 11;
    var gap = 3;
    var left = 28;
    var top = 16;
    var weeks = [];
    var cursor = new Date(start);
    while (cursor <= today) {
      weeks.push(new Date(cursor));
      cursor.setDate(cursor.getDate() + 7);
    }
    if (!weeks.length) {
      var card = document.getElementById('github-activity-card');
      if (card) card.style.display = 'none';
      return;
    }
    var colors = ['#ebedf0', '#9be9a8', '#40c463', '#30a14e', '#216e39'];
    var width = left + weeks.length * (cell + gap) - gap;
    var height = top + 7 * (cell + gap) - gap + 18;
    var monthLabels = '';
    var lastMonth = -1;
    var cells = '';
    weeks.forEach(function (weekStart, w) {
      if (weekStart.getMonth() !== lastMonth) {
        lastMonth = weekStart.getMonth();
        var labelX = left + w * (cell + gap);
        if (labelX < width - 24) {
          monthLabels += '<text x="' + labelX + '" y="11" fill="#656d76" font-size="10">' +
            escapeHtml(weekStart.toLocaleString('en', { month: 'short' })) + '</text>';
        }
      }
      for (var d = 0; d < 7; d++) {
        var day = new Date(weekStart);
        day.setDate(weekStart.getDate() + d);
        if (day > today) continue;
        var info = byDate[isoDate(day)] || {};
        var level = Math.max(0, Math.min(4, numOr(info.level, 0)));
        var count = numOr(info.count, 0);
        var x = left + w * (cell + gap);
        var y = top + d * (cell + gap);
        cells += '<rect x="' + x + '" y="' + y + '" width="' + cell + '" height="' + cell +
          '" rx="2" ry="2" fill="' + colors[level] + '"><title>' + count +
          ' contributions on ' + isoDate(day) + '</title></rect>';
      }
    });
    var dayLabels = ['', 'Mon', '', 'Wed', '', 'Fri', ''].map(function (label, i) {
      if (!label) return '';
      return '<text x="0" y="' + (top + i * (cell + gap) + 9) +
        '" fill="#656d76" font-size="9">' + label + '</text>';
    }).join('');
    var legendX = width - 92;
    var legend = '<text x="' + (legendX - 22) + '" y="' + (height - 2) +
      '" fill="#656d76" font-size="9">Less</text>';
    colors.forEach(function (color, i) {
      legend += '<rect x="' + (legendX + i * 12) + '" y="' + (height - 11) +
        '" width="10" height="10" rx="2" fill="' + color + '"></rect>';
    });
    legend += '<text x="' + (legendX + 64) + '" y="' + (height - 2) +
      '" fill="#656d76" font-size="9">More</text>';
    el.innerHTML =
      '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="GitHub contributions">' +
      monthLabels + dayLabels + cells + legend + '</svg>';
  }

  var scholarEl = document.getElementById('scholar-citation-chart');
  if (scholarEl && scholarEl.getAttribute('data-fallback')) {
    try {
      renderScholarWidget(JSON.parse(scholarEl.getAttribute('data-fallback')));
    } catch (err) {
      console.log('Failed to parse scholar chart fallback', err);
    }
  }

  var githubEl = document.getElementById('github-activity-chart');
  var githubUser = githubEl && githubEl.getAttribute('data-username');
  if (githubUser) {
    fetch('https://github-contributions-api.jogruber.de/v4/' + githubUser)
      .then(function (resp) {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      })
      .then(function (payload) {
        renderGithubHeatmap(payload.contributions || []);
      })
      .catch(function (err) {
        console.log('Failed to load GitHub contributions', err);
        var card = document.getElementById('github-activity-card');
        if (card) card.style.display = 'none';
      });
  }
})();
</script>
