<script>
$(document).ready(function () {
  var gsDataUrl = '/google-scholar-stats/gs_data.json';
  
  $.getJSON(gsDataUrl, function (data) {
    if (data && data.publications) {
      $('.paper_citations').each(function () {
        var paperId = $(this).data('paper-id');
        if (paperId && data.publications[paperId]) {
          var numCitations = data.publications[paperId].num_citations;
          // Update Shields.io badge URL
          var newSrc = 'https://img.shields.io/badge/Citations-' + numCitations + '-blue?style=social&logo=google-scholar';
          $(this).attr('src', newSrc);
        }
      });
    }
  }).fail(function() {
    console.log("Failed to load Google Scholar stats from " + gsDataUrl);
  });
});
</script>
