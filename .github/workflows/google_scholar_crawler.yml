name: Fetch Google Scholar Citations

on:
  schedule:
    - cron: '0 8 1 1-8,10-12 *'   # monthly on the 1st, skip September; 08:00 UTC
  workflow_dispatch:      # also triggerable manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scholarly
        run: pip install scholarly==1.7.11

      - name: Fetch citations
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'edyJPQQAAAAJ' }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
        run: python google_scholar_crawler/main.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update google scholar citation stats"
            git push
          else
            echo "No changes to citation stats."
          fi
