name: Update Google Scholar Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install -r google_scholar_crawler/requirements.txt

    - name: Run crawler
      run: python google_scholar_crawler/main.py
      env:
        GOOGLE_SCHOLAR_ID: ${{ vars.GOOGLE_SCHOLAR_ID || 'edyJPQQAAAAJ' }}

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add google-scholar-stats/*.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update Google Scholar stats" && git push)
